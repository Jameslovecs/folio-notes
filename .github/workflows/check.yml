name: Checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run preview > /tmp/folio-preview.log 2>&1 &
      - run: npx wait-on http://127.0.0.1:8787
      - run: npm run test:e2e
